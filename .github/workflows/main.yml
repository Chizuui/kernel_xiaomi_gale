name: Build Kernel Gale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc bison flex libssl-dev libelf-dev build-essential python3

    - name: Clone Toolchain
      run: |
        mkdir -p toolchain
        # Clang MTK
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang
        # GCC ARM64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain/gcc32

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="gale"
        export KBUILD_BUILD_HOST="github"
        export PATH=$PWD/toolchain/clang/bin:$PATH
        make O=out ARCH=arm64 gale_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=$PWD/toolchain/gcc64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$PWD/toolchain/gcc32/bin/arm-linux-androideabi-

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Dragon-Kernel-Image
        path: out/arch/arm64/boot/Image.gz
